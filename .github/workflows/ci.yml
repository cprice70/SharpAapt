name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    # Windows covers aapt2.exe lookup and Windows argument quoting; the fake-aapt client
    # tests are POSIX-only and skip there. Packing happens once, on Ubuntu.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # GitHub-hosted runners ship the Android SDK; fail rather than skip if it goes missing.
      SHARPAAPT_REQUIRE_SDK: 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # On a v1.2.3 tag, build and pack as version 1.2.3; otherwise use the csproj version.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore SharpAapt.sln

      - name: Build
        run: dotnet build SharpAapt.sln --configuration Release --no-restore ${VERSION:+-p:Version=$VERSION}

      - name: Test
        run: >
          dotnet test SharpAapt.Tests/SharpAapt.Tests.csproj
          --configuration Release --no-build
          --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: >
          dotnet pack SharpAapt/SharpAapt.csproj
          --configuration Release --no-build
          --output artifacts
          ${VERSION:+-p:Version=$VERSION}

      - name: Upload package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: artifacts/*.nupkg

  publish:
    # Pushes the package to nuget.org when a v* tag is pushed, using nuget.org trusted publishing:
    # GitHub's OIDC token is exchanged for a one-hour API key, so no long-lived key is stored.
    # The nuget.org policy must name this repository and the workflow file "ci.yml". The
    # NUGET_USER secret holds the nuget.org profile name (not the email address).
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: artifacts

      - name: NuGet login (OIDC to temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
